[package]
name = "distributed-database"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"]}
bincode = "1.3"
tokio = { version = "1", features = ["full"]}
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[[bin]]
name = "master"
path = "src/main.rs"

[dev-dependencies]
rcgen = "0.13"


